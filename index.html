<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Magical Farm Portfolio - 夢幻農場作品集</title>
    <!-- Google Fonts for Cute Farm Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. RESET & SYSTEM VARIABLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', 'Mochiy Pop One', 'Comic Sans MS', sans-serif;
        }

        :root {
            --sky-top: #70d6ff;
            --sky-bottom: #e7c6ff;
            --grass-light: #9ed851;
            --grass-dark: #63b32e;
            --wood-primary: #8b5a2b;
            --wood-dark: #523112;
            --wood-light: #e0a96d;
            --wood-board: #fff5e4;
            --gold-accent: #ffb703;
            --orange-badge: #ffb703;
            --text-dark: #4a2c11;
            --shadow-3d: 0 8px 0 #523112;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, var(--sky-top) 0%, #c8f7dc 45%, var(--grass-light) 45%, var(--grass-dark) 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }

        /* ==========================================
           2. ANIMATED BACKGROUND ELEMENTS
           ========================================== */
        /* Animated Sun */
        .sun {
            position: fixed;
            top: 40px;
            right: 60px;
            width: 90px;
            height: 90px;
            background: #ffbe0b;
            border-radius: 50%;
            box-shadow: 0 0 40px #ffbe0b, 0 0 80px #ff006e;
            animation: sunGlow 4s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes sunGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #ffbe0b); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 30px #ffbe0b); }
        }

        /* Floating Clouds */
        .cloud {
            position: fixed;
            background: #fff;
            border-radius: 50px;
            opacity: 0.9;
            z-index: 1;
            pointer-events: none;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        .cloud1 {
            top: 8%; left: -150px;
            width: 140px; height: 50px;
            animation: moveCloud 30s linear infinite;
        }

        .cloud2 {
            top: 20%; left: -200px;
            width: 200px; height: 70px;
            animation: moveCloud 45s linear infinite 10s;
        }

        @keyframes moveCloud {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(calc(100vw + 300px)); }
        }

        /* ==========================================
           3. MAIN CONTAINER & PROFILE BOARD
           ========================================== */
        .farm-wrapper {
            max-width: 1050px;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Wooden Sign Profile */
        .profile-card {
            background: #fdf6e2;
            border: 6px solid var(--wood-dark);
            border-radius: 32px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 14px 0 var(--wood-dark), 0 20px 30px rgba(0,0,0,0.25);
            margin-bottom: 45px;
            position: relative;
            width: 100%;
            max-width: 580px;
            background-image: radial-gradient(#e6ccb2 15%, transparent 16%);
            background-size: 20px 20px;
        }

        /* Wooden Hanger Ropes */
        .profile-card::before, .profile-card::after {
            content: "";
            position: absolute;
            top: -35px;
            width: 12px;
            height: 35px;
            background: #d4a359;
            border: 3px solid var(--wood-dark);
            border-radius: 6px;
        }
        .profile-card::before { left: 50px; }
        .profile-card::after { right: 50px; }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
        }

        .avatar-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffbe0b, #ff006e, #833ab4);
            padding: 6px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            animation: spinRing 12s linear infinite;
        }

        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            background: #fff;
        }

        .farmer-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--wood-dark);
            text-shadow: 2px 2px 0 #fff;
            margin-bottom: 10px;
        }

        /* XP Progress Bar */
        .xp-bar-container {
            background: #e0d6c3;
            border: 3px solid var(--wood-dark);
            border-radius: 20px;
            height: 24px;
            width: 80%;
            margin: 10px auto 0;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
        }

        .xp-fill {
            height: 100%;
            width: 12.5%; /* 2 of 16 completed */
            background: linear-gradient(90deg, #70e000, #38b000);
            border-radius: 15px;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 10px #70e000;
        }

        .xp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--wood-dark);
            text-shadow: 1px 1px 0 #fff;
        }

        /* ==========================================
           4. 16 FARM PLOTS GRID (CARDS)
           ========================================== */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            width: 100%;
        }

        .plot-card {
            position: relative;
            height: 135px;
            border-radius: 24px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 5px solid var(--wood-dark);
        }

        /* --- UNLOCKED PLOT --- */
        .plot-card.unlocked {
            background: linear-gradient(145deg, #fff3b0 0%, #ffde59 100%);
            box-shadow: 0 10px 0 var(--wood-dark), 0 12px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            overflow: hidden;
        }

        /* Shimmer Effect on Hover */
        .plot-card.unlocked::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: rotate(30deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .plot-card.unlocked:hover::before {
            transform: rotate(30deg) translateY(100%);
        }

        .plot-card.unlocked .badge {
            background: #ff5757;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 12px;
            border: 2px solid var(--wood-dark);
            margin-bottom: 8px;
            box-shadow: 0 3px 0 var(--wood-dark);
        }

        .plot-card.unlocked .title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--wood-dark);
            text-align: center;
            line-height: 1.2;
        }

        .plot-card.unlocked .crop-icon {
            position: absolute;
            bottom: 6px;
            right: 8px;
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .plot-card.unlocked:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 16px 0 var(--wood-dark), 0 20px 30px rgba(0,0,0,0.3);
            background: linear-gradient(145deg, #ffffff 0%, #ffe566 100%);
        }

        .plot-card.unlocked:hover .crop-icon {
            transform: scale(1.4) rotate(15deg);
        }

        /* --- LOCKED PLOT --- */
        .plot-card.locked {
            background: linear-gradient(145deg, #a39385 0%, #6e5f54 100%);
            box-shadow: 0 8px 0 #3d332a;
            border-color: #3d332a;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .plot-card.locked .lock-body {
            background: #ffb703;
            border: 3px solid #3d332a;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            box-shadow: 0 4px 0 #3d332a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .plot-card.locked .lock-icon {
            font-size: 1.4rem;
        }

        .plot-card.locked .title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e9e4de;
            text-shadow: 1px 1px 0 #3d332a;
        }

        .plot-card.locked:hover {
            transform: translateY(-3px);
            opacity: 1;
        }

        .plot-card.locked:hover .lock-body {
            animation: lockWiggle 0.4s ease;
        }

        @keyframes lockWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg) scale(1.1); }
            75% { transform: rotate(10deg) scale(1.1); }
        }

        /* ==========================================
           5. RESPONSIVE DESIGN
           ========================================== */
        @media (max-width: 900px) {
            .farm-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 600px) {
            .farm-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .profile-card {
                padding: 20px;
            }

            .farmer-title {
                font-size: 1.6rem;
            }

            .plot-card {
                height: 115px;
            }

            .plot-card.unlocked .title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
