
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff5f5">
<title>My Digital Business Card</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: "Arial", sans-serif;
    color: #555;
    background: linear-gradient(135deg, #fff5f5, #f0f4ff);
}

.card {
    width: 100%;
    max-width: 380px;
    background: white;
    border-radius: 28px;
    overflow: hidden;
    text-align: center;
    border: 1px solid #fff;
    box-shadow: 0 15px 35px rgba(200,180,210,.25);
    transition: transform .3s, box-shadow .3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 22px 45px rgba(180,160,200,.35);
}

.header {
    height: 115px;
    background: linear-gradient(135deg,#ffd1dc,#e0c3fc);
}

.avatar-wrapper {
    margin-top: -58px;
    margin-bottom: 15px;
}

.avatar {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid white;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
    cursor: pointer;
    animation: floating 4s ease-in-out infinite;
}

@keyframes floating {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

.status {
    width: 16px;
    height: 16px;
    background: #4ade80;
    border: 2px solid white;
    border-radius: 50%;
    position: absolute;
    bottom: 5px;
    right: 5px;
}

.profile {
    padding: 0 25px 28px;
}

h1 {
    font-size: 23px;
    color: #444;
    margin-bottom: 7px;
    letter-spacing: 1px;
}

.job {
    font-size: 12px;
    color: #a276d9;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

.description {
    background: #fff4f7;
    border: 1px solid #fce0e8;
    border-radius: 17px;
    padding: 15px;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 22px;
}

.social {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
}

.btn {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 14px 8px;
    border-radius: 15px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    transition: .25s;
    cursor: pointer;
}

.instagram {
    color: #d94d83;
    background: #fff0f5;
    border: 1px solid #f8d1df;
}

.email {
    color: #7771cb;
    background: #f1f0ff;
    border: 1px solid #dedcff;
}

.instagram:hover {
    background: #f7a8b8;
    color: white;
}

.email:hover {
    background: #a99bea;
    color: white;
}

.like-btn {
    width: 100%;
    background: #fff8e8;
    color: #c28c27;
    border: 1px solid #f5e4b8;
    padding: 14px;
    border-radius: 15px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.like-btn:hover {
    background: #fff0ca;
    transform: translateY(-2px);
}

.heart {
    color: #f7a8b8;
    display: inline-block;
}

.heart.active {
    color: #ef4444;
}

.pulse {
    animation: pulse .4s ease;
}

@keyframes pulse {
    50% { transform: scale(1.4); }
}

.footer {
    padding: 15px;
    background: #fafafa;
    border-top: 1px solid #f1f1f1;
    color: #aaa;
    font-size: 11px;
}

.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: #777;
    padding: 14px 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0002;
    border: 1px solid #f7cbd9;
    font-size: 13px;
    z-index: 9999;
    animation: appear .3s ease;
    width: max-content;
    max-width: 90%;
}

@keyframes appear {
    from { opacity: 0; margin-top: -10px; }
    to { opacity: 1; margin-top: 0; }
}

</style>
</head>

<body>

<main class="card">

    <div class="header"></div>

    <div class="avatar-wrapper">
        <div style="position:relative;display:inline-block;">
            <img
                class="avatar"
                id="avatarImg"
                src="https://i.postimg.cc/6qKXrr65/2a-Obo-R3Mxfrq-Sn7vze-St-Yf-WDG1a-A8Si-AJPMey7wu.jpg"
                alt="Personal Avatar"
                onerror="this.onerror=null;this.src='https://placehold.co/300x300/ffd1dc/4a4a5a?text=Avatar';"
            >
            <span class="status"></span>
        </div>
    </div>

    <section class="profile">

        <h1>TRẦN HOÀNG OANH</h1>

        <p class="job">
            VISUAL DESIGNER & CREATIVE CREATOR
        </p>

        <p class="description">
            ✨ 探索生活與視覺美的設計新手
            <br>
            用色彩紀錄每個美好瞬間
        </p>

        <div class="social">

            <a
                class="btn instagram"
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                📷 Instagram
            </a>

            <a
                class="btn email"
                href="mailto:your-email@example.com"
            >
                ✉️ Email
            </a>

        </div>

        <button class="like-btn" id="likeBtn" type="button">
            <span class="heart" id="heartIcon">♥</span>
            送出愛心 (<span id="likeCount">0</span>)
        </button>

    </section>

    <footer class="footer">
        © 2026 Macaron Digital Card
    </footer>

</main>

<script>
(function () {

    let count = 0;

    const likeBtn = document.getElementById("likeBtn");
    const likeCount = document.getElementById("likeCount");
    const heartIcon = document.getElementById("heartIcon");
    const avatar = document.getElementById("avatarImg");

    likeBtn.addEventListener("click", function () {

        count++;

        likeCount.textContent = count;

        heartIcon.classList.remove("pulse");
        void heartIcon.offsetWidth;
        heartIcon.classList.add("pulse");
        heartIcon.classList.add("active");

    });

    avatar.addEventListener("click", function () {

        const oldToast = document.querySelector(".toast");

        if (oldToast) oldToast.remove();

        const toast = document.createElement("div");

        toast.className = "toast";
        toast.textContent =
            "👋 哈囉！歡迎來到我的粉嫩個人數位名片！";

        document.body.appendChild(toast);

        setTimeout(function () {
            toast.remove();
        }, 2500);

    });

})();
</script>

</body>
</html>
