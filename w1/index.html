<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片 - Digital Business Card</title>

  <!-- 載入 Google 字體與 FontAwesome 圖示庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ==========================================
       CSS 樣式區塊 (馬卡龍色系、陰影與置中佈局)
       ========================================== -->
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #f0f4ff 100%);
      --card-bg: #ffffff;
      --text-main: #4a4a5a;
      --text-sub: #7a7c8d;
      --header-gradient: linear-gradient(135deg, #ffd1dc 0%, #e0c3fc 100%);
      --macaron-purple: #cbb4f6;
      --card-shadow: 0 15px 35px rgba(200, 180, 210, 0.25);
      --btn-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 卡片主體：圓角、微陰影、置中 */
    .profile-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .profile-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(180, 160, 200, 0.35);
    }

    /* 頂部馬卡龍漸層裝飾 */
    .card-header {
      height: 100px;
      background: var(--header-gradient);
    }

    /* 圓形大頭貼外框 */
    .avatar-wrapper {
      margin-top: -55px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .avatar:active {
      transform: scale(0.92);
    }

    /* 內文區塊 */
    .card-body {
      padding: 10px 28px 28px 28px;
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* 按鈕群組 (Instagram 與 Email) */
    .button-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: var(--btn-shadow);
      transition: all 0.25s ease;
    }

    /* Instagram 按鈕粉嫩風格 */
    .btn-instagram {
      background-color: #fff0f3;
      color: #e65c82;
      border: 1px solid #ffd6e0;
    }

    .btn-instagram:hover {
      background-color: #f7a8b8;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(247, 168, 184, 0.4);
    }

    /* Email 按鈕柔和紫藍風格 */
    .btn-email {
      background-color: #f0f4ff;
      color: #5b6275;
      border: 1px solid #dbeafe;
    }

    .btn-email:hover {
      background-color: var(--macaron-purple);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(203, 180, 246, 0.4);
    }
  </style>
</head>
<body>

  <!-- ==========================================
       HTML 結構區塊
       ========================================== -->
  <main class="profile-card">
    
    <div class="card-header"></div>

    <!-- 圓形大頭貼 -->
    <div class="avatar-wrapper">
      <img id="avatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" alt="大頭貼" class="avatar">
    </div>

    <div class="card-body">
      <!-- 名字與簡短自我介紹 -->
      <h1 class="name">你的名字</h1>
      <p class="bio">✨ 探索生活與視覺美的設計新手 | 用色彩紀錄每個美好瞬間</p>

      <!-- 兩個按鈕：Instagram 與 Email -->
      <div class="button-group">
        <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
          <i class="fa-brands fa-instagram"></i>
          <span>Instagram</span>
        </a>

        <a href="mailto:your-email@example.com" class="btn btn-email">
          <i class="fa-regular fa-envelope"></i>
          <span>Email</span>
        </a>
      </div>
    </div>

  </main>

  <!-- ==========================================
       JavaScript 互動區塊
       ========================================== -->
  <script>
    // 點擊大頭貼時會彈出歡迎小視窗
    const avatarImg = document.getElementById('avatarImg');
    
    avatarImg.addEventListener('click', function() {
      alert('👋 哈囉！歡迎來到我的個人數位名片！');
    });
  </script>

</body>
</html>
