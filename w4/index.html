<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 🌾</title>
  
  <!-- 引入 Google Fonts 可愛字型與手寫風字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       【農場可愛風 (Farm Cute) 主題色彩配置與變數】
       👉 在這裡修改主題顏色與輪播相關變數設定
       ========================================== */
    :root {
      --bg-color: #f7f3e9;         /* 網頁背景色：柔和溫暖的奶油米黃 */
      --card-bg: #fffdf9;          /* 卡片背景色：暖白 */
      --primary-color: #769fcd;    /* 主色調：天空藍 */
      --accent-color: #ff9a76;     /* 強調色：暖橘紅 */
      --farm-green: #b5e5cf;       /* 農場綠：嫩芽綠 */
      --farm-brown: #6e5773;       /* 文字與邊框色：深木棕色 */
      --card-border: #e2d5c3;      /* 卡片預設邊框色 */
      
      /* 高亮特寫 (Highlight) 動效相關設定 */
      --highlight-border: #ffb703;  /* 輪播選中時的邊框顏色（金色/太陽黃） */
      --highlight-shadow: rgba(255, 183, 3, 0.45); /* 輪播選中時發光的陰影顏色 */
      --transition-speed: 0.5s;    /* 特效切換的平滑過渡時間（秒） */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* 塗鴉草地背景紋理 */
      background-image: 
        radial-gradient(var(--farm-green) 15%, transparent 16%),
        radial-gradient(var(--farm-green) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      font-family: 'Zen Maru Gothic', 'Fredoka', cursive, sans-serif;
      color: var(--farm-brown);
      padding: 30px 20px 60px;
      min-height: 100vh;
    }

    /* 頁頭標題區塊 */
    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--farm-brown);
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      background: #ffffffa6;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      border: 2px stroke var(--farm-brown);
    }

    /* ==========================================
       【載入中酷炫動畫 (Loading Animation)】
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 80px 0;
    }

    .tractor-loader {
      font-size: 3.5rem;
      animation: bounce 0.8s infinite alternate ease-in-out;
    }

    .loading-text {
      margin-top: 15px;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }

    @keyframes bounce {
      from { transform: translateY(0) rotate(-3deg); }
      to { transform: translateY(-18px) rotate(3deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ==========================================
       【瀑布流版型 (Masonry Layout)】
       ========================================== */
    .masonry-wall {
      /* 響應式欄數設定 */
      column-count: 3;             /* 預設大螢幕顯示 3 欄 */
      column-gap: 20px;            /* 欄與欄之間的間隙 */
      max-width: 1200px;
      margin: 0 auto;
      transition: filter var(--transition-speed);
    }

    /* 平板螢幕適配 */
    @media (max-width: 900px) {
      .masonry-wall {
        column-count: 2;
      }
    }

    /* 手機螢幕適配 */
    @media (max-width: 600px) {
      .masonry-wall {
        column-count: 1;
      }
    }

    /* ==========================================
       【留言卡片樣式與焦點輪播特效】
       ========================================== */
    .message-card {
      break-inside: avoid;          /* 防止卡片在瀑布流中被截斷拆成兩半 */
      margin-bottom: 20px;
      background-color: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 6px 0px var(--card-border);
      position: relative;
      /* 邊線滑順過渡 */
      transition: transform var(--transition-speed) ease, 
                  box-shadow var(--transition-speed) ease, 
                  border-color var(--transition-speed) ease,
                  filter var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      cursor: pointer;
    }

    /* 可愛小貼紙裝飾 */
    .message-card::after {
      content: '🌾';
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 1.2rem;
      opacity: 0.6;
    }

    /* 留言者暱稱 */
    .card-author {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-author::before {
      content: '🐥';
      font-size: 1.2rem;
    }

    /* 留言時間 */
    .card-time {
      font-size: 0.75rem;
      color: #a09383;
      margin-bottom: 12px;
    }

    /* 留言本文內容 */
    .card-content {
      font-size: 1rem;
      line-height: 1.6;
      word-break: break-word;
      color: var(--farm-brown);
      white-space: pre-wrap; /* 保持留言者的換行格式 */
    }

    /* ------------------------------------------
       【焦點特寫 Highlight 動效（重點）】
       當 JavaScript 加上 .highlight 類別時生效
       ------------------------------------------ */
    .message-card.highlight {
      transform: scale(1.08) translateY(-5px); /* 放大並稍微懸浮 */
      border-color: var(--highlight-border);
      box-shadow: 0 12px 25px var(--highlight-shadow);
      z-index: 10;                              /* 確保高亮卡片在最上層 */
      filter: brightness(1.05);                 /* 稍微提高亮度 */
    }

    /* 輪播時「沒被選中」的卡片樣式 */
    .masonry-wall.carousel-active .message-card:not(.highlight) {
      opacity: 0.55;             /* 透明度降低變暗 */
      filter: blur(1.5px);        /* 稍微變模糊 */
      transform: scale(0.96);     /* 稍微縮小 */
    }
  </style>
</head>
<body>

  <!-- 頁頭資訊區 -->
  <header>
    <h1>🚜 朋友對我的動態留言板 🐥</h1>
    <p>農場裡溫馨的留言牆，歡迎來踩踩！</p>
  </header>

  <!-- 資料載入中的酷炫動畫 -->
  <div id="loading">
    <div class="tractor-loader">🚜💨</div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流留言牆容器 -->
  <main class="masonry-wall" id="wall"></main>

  <script>
    /* ==========================================
       【JavaScript 邏輯與參數控制】
       ========================================== */

    // 1. Google 試算表 CSV 網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyVAUcUv7BbaB8y7wcIIG1SG5ilkJdYVuBQ34ihOW1z63Dk8l6YegAkhqvwWgGFnohNtt3CpfWwFRF/pub?output=csv';

    // 2. 輪播頻率設定 (單位：毫秒)
    // 👉 可直接修改此數值：3000 代表 3 秒鐘切換一張卡片
    const CAROUSEL_INTERVAL = 3000; 

    let cardsList = [];      // 儲存 DOM 中的卡片元素
    let currentIndex = 0;    // 當前高亮顯示的卡片索引號碼
    let carouselTimer = null; // 計時器物件

    // 當 DOM 載入完成後發動主流程
    document.addEventListener('DOMContentLoaded', () => {
      fetchAndRenderMessages();
    });

    /**
     * 讀取並渲染留言的主函數
     */
    async function fetchAndRenderMessages() {
      const loadingEl = document.getElementById('loading');
      const wallEl = document.getElementById('wall');

      try {
        // 從 Google 試算表獲取 CSV 內容
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('網路請求失敗');
        const csvText = await response.text();

        // 解析 CSV 資料為陣列結構
        const parsedData = parseCSV(csvText);

        // 隱藏載入中動畫
        loadingEl.style.display = 'none';

        // 若無任何資料則顯示無留言提示
        if (parsedData.length === 0) {
          wallEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">目前還沒有留言唷！</p>';
          return;
        }

        // 動態產生每一張留言卡片
        parsedData.forEach((item) => {
          const card = createCardElement(item);
          wallEl.appendChild(card);
        });

        // 取得所有產生的卡片元素
        cardsList = Array.from(document.querySelectorAll('.message-card'));

        // 啟動 3 秒輪播亮起特效
        startCarousel();

      } catch (error) {
        console.error('讀取失敗:', error);
        loadingEl.innerHTML = `<div class="loading-text" style="color:#d9534f;">😭 讀取留言失敗，請稍後再試！</div>`;
      }
    }

    /**
     * 穩健的 CSV 解析器 (能夠精準處理含有逗號與雙引號換行的內容)
     * @param {string} text - 原始 CSV 文字
     * @returns {Array<Object>} 解析好的留言物件陣列
     */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            // 處理雙雙引號的轉義 (Escape)
            currentCell += '"';
            i++;
          } else {
            // 切換引號狀態
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          // 逗號代表一個欄位的結束
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          // 換行代表列的結束
          if (char === '\r' && nextChar === '\n') i++; // 處理 Windows \r\n
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell.length > 0)) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      // 補上最後一個欄位與列
      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      // 移除試算表的第一行（表頭標題列）
      if (rows.length > 0) rows.shift();

      // 映射資料欄位 [0: 時間戳記, 1: 暱稱, 2: 留言內容]
      return rows.map(row => ({
        timestamp: row[0] || '未知時間',
        name: row[1] || '熱心農夫',
        message: row[2] || '（這個人很懶，什麼都沒留下）'
      }));
    }

    /**
     * 建立卡片的 HTML DOM 元素
     */
    function createCardElement(data) {
      const card = document.createElement('div');
      card.className = 'message-card';

      // 格式化顯示時間
      const formattedTime = formatTimestamp(data.timestamp);

      card.innerHTML = `
        <div class="card-author">${escapeHTML(data.name)}</div>
        <div class="card-time">${formattedTime}</div>
        <div class="card-content">${escapeHTML(data.message)}</div>
      `;

      return card;
    }

    /**
     * 3 秒鐘依序輪播亮起特效 (Highlights Carousel)
     */
    function startCarousel() {
      if (cardsList.length === 0) return;

      const wallEl = document.getElementById('wall');
      // 標示輪播啟動中，讓 CSS 將未選中的卡片自動縮小/模糊
      wallEl.classList.add('carousel-active');

      // 立即觸發第一張卡片
      highlightCard(currentIndex);

      // 設定循環計時器
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsList.length; // 循環索引
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    /**
     * 將指定的卡片套用亮起 (Highlight) 效果
     * @param {number} index - 卡片陣列索引
     */
    function highlightCard(index) {
      cardsList.forEach((card, i) => {
        if (i === index) {
          card.classList.add('highlight');

          // 自動捲動畫面將正在展示的卡片平滑移動至視野中央
          card.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest'
          });
        } else {
          card.classList.remove('highlight');
        }
      });
    }

    /**
     * 安全轉義 HTML 避免 XSS 注入攻擊
     */
    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, (match) => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }

    /**
     * 時間格式簡化轉換
     */
    function formatTimestamp(rawTime) {
      if (!rawTime) return '';
      // 如果時間字串包含年份等，只抓取常規部分顯示
      return rawTime.split(' ')[0] || rawTime;
    }
  </script>
</body>
</html>
